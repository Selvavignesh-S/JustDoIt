spring.application.name=backend

# Server Configuration
server.port=${PORT:8080}
server.shutdown=graceful
# Trust X-Forwarded-For from Render's proxy so rate limits see the real client IP, not the proxy's
server.forward-headers-strategy=native

# Database / PostgreSQL Configuration (Supports local Postgres & Supabase Pooler)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/justdoit}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Tuned for Render 512MB RAM and Supabase Transaction Pooler)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator & Health Check (Used by Render & cron-job.org keep-alive pings)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# File Upload / Multipart Constraints (SRS Section 17: Max 50 MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Storage Service Configuration (Local for dev, Backblaze B2 via its S3-compatible API for deployment)
storage.provider=${STORAGE_PROVIDER:local}
storage.local.base-dir=${LOCAL_STORAGE_DIR:./storage}
storage.s3.endpoint=${B2_ENDPOINT:https://s3.eu-central-003.backblazeb2.com}
storage.s3.bucket=${B2_BUCKET:JustDoItProject}
storage.s3.access-key=${B2_KEY_ID:}
storage.s3.secret-key=${B2_APPLICATION_KEY:}
storage.s3.region=${B2_REGION:eu-central-003}

# AI Provider Configuration (Gemini Primary, Groq Fallback). Smallest models with reasoning switchable off (SRS 8.6);
# gemini-2.5-* is closed to new accounts, and Groq's qwen model is a preview that may be withdrawn: swap via env var.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# Security / JWT Configuration
# Required, no fallback: a committed default would let a misconfigured deploy sign tokens with a public key
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Email Service Configuration
# console = print emails to the log (local dev only); resend = send for real
mail.provider=${MAIL_PROVIDER:console}
mail.api-key=${EMAIL_API_KEY:}
mail.from=${MAIL_FROM:noreply@justdoit.app}
